name: Android release

# Builds a signed Android App Bundle (.aab) and debug .apk whenever a
# version tag (e.g. v1.2.3 or android-v1.2.3) is pushed, and attaches the
# bundle to a GitHub Release for upload to the Play Console.
#
# Required secrets (configure under repo Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   Base64-encoded contents of the release .jks keystore
#   KEYSTORE_PASSWORD         Password for the keystore
#   KEY_ALIAS                 Alias of the signing key inside the keystore
#   KEY_PASSWORD              Password for the signing key alias
#   GITHUB_TOKEN              Provided automatically; used to upload release assets

on:
  push:
    tags:
      - 'v*'
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/android/**/*.gradle*', 'apps/android/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage app icon and splash
        run: |
          mkdir -p apps/android/resources
          cp artifacts/restaurant-platform/public/logo.png apps/android/resources/icon.png
          cp artifacts/restaurant-platform/public/logo.png apps/android/resources/splash.png

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set; refusing to build an unsigned release bundle." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          KEYSTORE_FILE="$RUNNER_TEMP/android-signing/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "Decoded keystore is empty; check the ANDROID_KEYSTORE_BASE64 secret." >&2
            exit 1
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "KEYSTORE_PATH ($KEYSTORE_PATH) is missing or empty before build." >&2
            exit 1
          fi
          pnpm --filter @workspace/android build:aab

      - name: Build debug APK
        run: pnpm --filter @workspace/android build:apk

      - name: Clean up keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"

      - name: Collect outputs
        run: |
          mkdir -p android-release
          cp apps/android/android/app/build/outputs/bundle/release/app-release.aab android-release/ || true
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk android-release/ || true
          ls -la android-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android-release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets

      - name: Attach bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
