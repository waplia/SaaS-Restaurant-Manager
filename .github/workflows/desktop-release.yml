name: Desktop release

# Builds signed Electron installers for Windows, macOS, and Linux whenever a
# version tag (e.g. v1.2.3 or desktop-v1.2.3) is pushed, and attaches the
# resulting artifacts to a GitHub Release.
#
# Required secrets (configure under repo Settings -> Secrets and variables -> Actions):
#   CSC_LINK                      Base64 or HTTPS URL of the Windows code-signing .pfx
#   CSC_KEY_PASSWORD              Password for the Windows .pfx above
#   MAC_CSC_LINK                  Base64 or HTTPS URL of the macOS Developer ID .p12
#   MAC_CSC_KEY_PASSWORD          Password for the macOS .p12 above
#   APPLE_ID                      Apple ID used for notarisation
#   APPLE_APP_SPECIFIC_PASSWORD   App-specific password for the Apple ID
#   APPLE_TEAM_ID                 Apple Developer team ID for notarisation
#   GITHUB_TOKEN                  Provided automatically; used to upload release assets

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact_glob: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*.blockmap
              apps/desktop/dist/latest*.yml
          - os: macos-latest
            script: build:mac
            artifact_glob: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
              apps/desktop/dist/*.blockmap
              apps/desktop/dist/latest*.yml
          - os: ubuntu-latest
            script: build:linux
            artifact_glob: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/latest*.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage icon
        shell: bash
        run: |
          mkdir -p apps/desktop/build
          cp artifacts/restaurant-platform/public/logo.png apps/desktop/build/icon.png

      - name: Build installer (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @workspace/desktop ${{ matrix.script }}

      - name: Build installer (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @workspace/desktop ${{ matrix.script }}

      - name: Build installer (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @workspace/desktop ${{ matrix.script }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Attach installers to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
