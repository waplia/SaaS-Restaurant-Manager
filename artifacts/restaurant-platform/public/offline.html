<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khana Lagao — Offline</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fff7f1;
        color: #1c1917;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #ffffff;
        border: 1px solid #f1e0d2;
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 8px 32px rgba(226, 90, 15, 0.08);
      }
      img { width: 64px; height: 64px; border-radius: 12px; }
      h1 { font-size: 22px; margin: 16px 0 8px; color: #e25a0f; }
      p { margin: 8px 0 0; color: #57534e; line-height: 1.5; }
      button {
        margin-top: 20px;
        background: #e25a0f;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #c84e0a; }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1917; color: #f5f5f4; }
        .card { background: #292524; border-color: #44403c; }
        p { color: #d6d3d1; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="logo.png" alt="Khana Lagao" />
      <h1>You're offline</h1>
      <p>Khana Lagao needs a network connection to load live orders, tables, and inventory. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
