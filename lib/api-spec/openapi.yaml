  # ─── Orders ───────────────────────────────────────────────────
  /restaurants/{restaurantId}/orders:
    get:
      operationId: listOrders
      tags: [orders]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
