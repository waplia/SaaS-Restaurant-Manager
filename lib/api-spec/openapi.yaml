          description: Updated order with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          description: Order is not editable
        "404":
          description: Order or menu item not found

  /restaurants/{restaurantId}/orders/{id}/items/{itemId}:
    delete:
      operationId: removeOrderItem
      tags: [orders]
      summary: Remove a line item from an open order
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: itemId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Updated order with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          description: Order is already completed
        "404":
          description: Order or item not found

  /restaurants/{restaurantId}/orders/{id}/discounts:
    post:
      operationId: applyOrderDiscountLine
      tags: [orders]
      summary: Apply a discount line to an order
      description: |
        Inserts a ledger row in `order_discounts` and recalculates totals.
        `reason` must match one of the preset reasons configured in
        Settings → Discounts. When the resulting amount exceeds the configured
        percent or flat threshold, a manager PIN is required and the server
        responds with 402 `{ requiresPin: true }`. Retry with `managerPin`.
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyOrderDiscountBody"
      responses:
        "200":
          description: Updated order with recalculated totals and discount ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          description: Invalid type, value, reason, or order state
        "402":
          description: Manager PIN required (threshold exceeded)
        "404":
          description: Order or order item not found
        "409":
          description: No preset reasons configured or manager PIN not set

  /restaurants/{restaurantId}/orders/{id}/discounts/{discountId}:
    delete:
      operationId: removeOrderDiscountLine
      tags: [orders]
      summary: Remove a discount ledger line and recalculate totals
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: discountId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Updated order with recalculated totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          description: Order is completed or cancelled
        "404":
          description: Order or discount line not found

  /restaurants/{restaurantId}/orders/{id}/void:
    post:
      operationId: voidOrder
      tags: [orders]
      summary: Cancel/void an order that has not yet been completed
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Voided order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Cannot void a completed order
        "404":
          description: Order not found

  /restaurants/{restaurantId}/orders/{id}/split:
    post:
      operationId: splitOrder
      tags: [orders]
      summary: Mark an order as paid via split payment across multiple methods
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [splits]
              properties:
                splits:
                  type: array
                  items:
                    type: object
                    required: [paymentMethod, amount]
                    properties:
                      paymentMethod: { type: string, enum: [cash, card, upi] }
                      amount: { type: number, description: "This leg's share of the order total (rupees)" }
                      amountTendered: { type: number, description: "Cash tendered (cash legs only)" }
                      stripePaymentIntentId: { type: string, description: "Stripe PaymentIntent ID (card legs)" }
                      razorpayPaymentId: { type: string, description: "Razorpay payment ID (UPI legs)" }
                      razorpayOrderId: { type: string, description: "Razorpay order ID (UPI legs)" }
                      razorpaySignature: { type: string, description: "Razorpay HMAC signature (UPI legs)" }
      responses:
        "200":
          description: Completed order after split payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Order already completed or cancelled
        "404":
          description: Order not found

  /restaurants/{restaurantId}/orders/{id}/razorpay-order:
