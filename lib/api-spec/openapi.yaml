    Shift:
      type: object
      required: [id, restaurantId, name, startTime, endTime]
      properties:
        id: { type: integer }
        restaurantId: { type: integer }
        name: { type: string }
        startTime: { type: string, description: "HH:MM 24h format" }
        endTime: { type: string, description: "HH:MM 24h format" }
        days:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }

    StaffShift:
      type: object
      required: [id, userId, shiftId, restaurantId, date]
      properties:
        id: { type: integer }
        userId: { type: integer }
        shiftId: { type: integer }
        restaurantId: { type: integer }
        date: { type: string }
        createdAt: { type: string }

    CreateShiftInput:
      type: object
      required: [name, startTime, endTime]
      properties:
        name: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        days:
          type: array
          items: { type: string }
        isActive: { type: boolean }

    UpdateShiftInput:
      type: object
      properties:
        name: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        days:
          type: array
          items: { type: string }
        isActive: { type: boolean }

    AssignStaffShiftInput:
      type: object
      required: [userId, shiftId, date]
      properties:
        userId: { type: integer }
        shiftId: { type: integer }
        date: { type: string }

    # ── Loyalty ──
    LoyaltyAccount:
      type: object
      required: [customerId, balance, transactions]
      properties:
        customerId: { type: integer }
        balance: { type: integer }
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/LoyaltyTransaction"

    LoyaltyTransaction:
      type: object
      required: [id, customerId, restaurantId, type, points, createdAt]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        restaurantId: { type: integer }
        orderId: { type: ["integer", "null"] }
        type: { type: string, enum: [earn, redeem, adjust] }
        points: { type: integer }
        description: { type: ["string", "null"] }
        createdAt: { type: string }

    LoyaltyTransactionInput:
      type: object
      required: [type, points]
      properties:
        type: { type: string, enum: [earn, redeem, adjust] }
        points: { type: integer }
        orderId: { type: integer }
        description: { type: string }

    # ── Realtime SSE ──
    SSEEvent:
      type: object
      required: [event, data]
      description: |
        Server-Sent Event envelope. The `event` field identifies the event type,
        `data` contains the JSON payload. Clients subscribe to
        GET /restaurants/{id}/events and should reconnect on disconnect
        (standard EventSource reconnection). Polling fallback uses the existing
        dashboard/kitchen/notification endpoints with their configured refetchIntervals.
      properties:
        event:
          type: string
          enum:
            - new_order
            - order_status_changed
            - ticket_status_changed
            - low_stock_alert
            - table_status_changed
            - new_notification
        data:
          type: object
          description: Event-specific payload; matches the relevant entity schema
          additionalProperties: true
        id:
          type: string
          description: Event ID for LastEventID reconnection

    # ── Public / Customer Ordering ──
    PublicMenu:
      type: object
      required: [restaurantId, restaurantName, categories]
      properties:
        restaurantId: { type: integer }
        restaurantName: { type: string }
        restaurantSlug: { type: string }
        logoUrl: { type: ["string", "null"] }
        currency: { type: string }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PublicMenuCategory"

    PublicMenuCategory:
      type: object
      required: [id, name, items]
      properties:
        id: { type: integer }
        name: { type: string }
        imageUrl: { type: ["string", "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"

    PublicOrderInput:
      type: object
      required: [restaurantId, tableId, items]
      properties:
        restaurantId: { type: integer }
        tableId: { type: integer }
        customerName: { type: string }
        customerPhone: { type: string }
        notes: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    PublicOrderResult:
      type: object
      required: [orderId, orderNumber, status, totalAmount]
      properties:
        orderId: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        totalAmount: { type: string }

    PublicOrderStatus:
      type: object
      required: [id, orderNumber, status, items]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        totalAmount: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemDetail"
        createdAt: { type: string }

    CallWaiterInput:
      type: object
      required: [restaurantId, tableId]
      properties:
        restaurantId: { type: integer }
        tableId: { type: integer }
        message: { type: string }

    CallWaiterResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: string }

    FeedbackInput:
      type: object
      required: [orderId, rating]
      properties:
        orderId: { type: integer }
        rating: { type: integer }
        comment: { type: string }

    FeedbackResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }

    # ── Admin ──
    AdminStats:
      type: object
      required: [totalTenants, activeTenants, trialTenants, totalRestaurants, totalOrders, totalRevenue]
      properties:
        totalTenants: { type: integer }
        activeTenants: { type: integer }
        trialTenants: { type: integer }
        suspendedTenants: { type: integer }
        totalRestaurants: { type: integer }
        totalOrders: { type: integer }
        totalRevenue: { type: string }
        planBreakdown:
          type: array
          items:
            type: object
            required: [planName, count]
            properties:
              planName: { type: string }
              count: { type: integer }

    # ── Marketing ──
    LeadInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        restaurantName: { type: string, nullable: true }
        businessType: { type: string, nullable: true }
        message: { type: string, nullable: true }
        sourcePage: { type: string, nullable: true }
        website: { type: string, nullable: true, description: "Honeypot — leave empty" }

    LeadSubmitResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        id: { type: integer }

    LeadUpdateInput:
      type: object
      properties:
        status: { type: string, enum: [new, contacted, demo_scheduled, converted, lost] }
        notes: { type: string, nullable: true }

    Lead:
      type: object
      required: [id, name, email, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        restaurantName: { type: string, nullable: true }
        businessType: { type: string, nullable: true }
        message: { type: string, nullable: true }
        sourcePage: { type: string, nullable: true }
        status: { type: string }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BlogPostSummary:
      type: object
      required: [id, slug, title, category, readMinutes, publishedAt, author]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        coverImage: { type: string, nullable: true }
        category: { type: string }
        readMinutes: { type: integer }
        publishedAt: { type: string, format: date-time }
        author: { type: string }

    BlogPost:
      type: object
      required: [id, slug, title, content, category, author, readMinutes, published]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        content: { type: string }
        coverImage: { type: string, nullable: true }
        category: { type: string }
        tags: { type: string, nullable: true }
        author: { type: string }
        readMinutes: { type: integer }
        published: { type: boolean }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BlogPostInput:
      type: object
      required: [slug, title, content, category, author]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        content: { type: string }
        coverImage: { type: string, nullable: true }
        category: { type: string }
        tags: { type: string, nullable: true }
        author: { type: string }
        readMinutes: { type: integer }
        published: { type: boolean }

    BlogPostDetail:
      type: object
      required: [post, related]
      properties:
        post: { $ref: '#/components/schemas/BlogPost' }
        related:
          type: array
          items: { $ref: '#/components/schemas/BlogPostSummary' }
