        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Live kitchen status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveKitchenStatus"

  /restaurants/{restaurantId}/dashboard/reports:
    get:
      operationId: getReports
      tags: [dashboard]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: period, in: query, schema: { type: string, enum: [7d, 30d, 90d, 1m, 1y] } }
        - { name: from, in: query, schema: { type: string, description: "ISO date string (YYYY-MM-DD)" } }
        - { name: to, in: query, schema: { type: string, description: "ISO date string (YYYY-MM-DD)" } }
        - { name: groupBy, in: query, schema: { type: string, enum: [daily, monthly, yearly] } }
      responses:
        "200":
          description: Reports data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsData"

  # ─── Public (unauthenticated) ─────────────────────────────────
  /public/menu/{slug}:
    get:
      operationId: getPublicMenu
      tags: [public]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public menu for customer ordering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMenu"

  /public/orders:
    post:
      operationId: createPublicOrder
      tags: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicOrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOrderResult"

  /public/orders/{id}:
    get:
      operationId: getPublicOrder
      tags: [public]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Public order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOrderStatus"

  /public/call-waiter:
    post:
      operationId: callWaiter
      tags: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallWaiterInput"
      responses:
        "200":
          description: Waiter called
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallWaiterResult"

  /public/feedback:
    post:
      operationId: submitFeedback
      tags: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResult"

  # ─── Roles & Permissions ──────────────────────────────────────
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List all roles for the current tenant
      parameters:
        - { name: tenantId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a new role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /roles/{id}:
    get:
      operationId: getRole
      tags: [roles]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Role with permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleWithPermissions"
        "404":
          description: Not found
    patch:
      operationId: updateRole
      tags: [roles]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleInput"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      operationId: deleteRole
      tags: [roles]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /permissions:
    get:
      operationId: listPermissions
      tags: [permissions]
      summary: List all available permissions
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"

  /roles/{id}/permissions:
    get:
      operationId: getRolePermissions
      tags: [permissions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Permissions assigned to role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
    post:
      operationId: assignPermissionToRole
      tags: [permissions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionId]
              properties:
                permissionId: { type: integer }
      responses:
        "201":
          description: Permission assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermission"

  /roles/{id}/permissions/{permissionId}:
    delete:
      operationId: removePermissionFromRole
      tags: [permissions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: permissionId, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Permission removed

  # ─── Shifts ───────────────────────────────────────────────────
  /restaurants/{restaurantId}/shifts:
    get:
      operationId: listShifts
      tags: [shifts]
      summary: List shift definitions for a restaurant
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
    post:
      operationId: createShift
      tags: [shifts]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShiftInput"
      responses:
        "201":
          description: Created shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"

  /restaurants/{restaurantId}/shifts/{id}:
    patch:
      operationId: updateShift
      tags: [shifts]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShiftInput"
      responses:
        "200":
          description: Updated shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
    delete:
      operationId: deleteShift
      tags: [shifts]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /restaurants/{restaurantId}/staff-shifts:
    get:
      operationId: listStaffShifts
      tags: [shifts]
      summary: List assigned staff shifts
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: userId, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string } }
      responses:
        "200":
          description: List of staff shift assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffShift"
    post:
      operationId: assignStaffShift
      tags: [shifts]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignStaffShiftInput"
      responses:
        "201":
          description: Staff shift assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffShift"

  # ─── Loyalty ──────────────────────────────────────────────────
  /restaurants/{restaurantId}/customers/{customerId}/loyalty:
    get:
      operationId: getCustomerLoyalty
      tags: [loyalty]
      summary: Get customer loyalty balance and transaction history
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: customerId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Loyalty balance and recent transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyAccount"
    post:
      operationId: recordLoyaltyTransaction
      tags: [loyalty]
      summary: Earn or redeem loyalty points
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: customerId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoyaltyTransactionInput"
      responses:
        "201":
          description: Transaction recorded, returns updated balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyTransaction"

  # ─── Realtime (SSE) ───────────────────────────────────────────
  /restaurants/{restaurantId}/events:
    get:
      operationId: subscribeRestaurantEvents
      tags: [realtime]
      summary: |
        Server-Sent Events stream for real-time restaurant updates.
        Emits typed events: new_order, order_status_changed, ticket_status_changed,
        low_stock_alert, table_status_changed, new_notification.
        Clients should reconnect automatically on disconnect.
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - name: lastEventId
          in: header
          description: Resume from last received event ID
          schema: { type: string }
      responses:
        "200":
          description: SSE stream — text/event-stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSEEvent"

  # ─── Super Admin ──────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [tenants]
      summary: Super admin platform stats
      responses:
        "200":
          description: Platform-wide stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  # ── Marketing: Public ──
  /leads:
    post:
      tags: [Marketing]
      summary: Submit a marketing lead (book demo / contact form)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadInput' }
      responses:
        '201':
          description: Lead recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadSubmitResult' }
        '400': { description: Invalid input }
        '429': { description: Rate limited }

  /blog/posts:
    get:
      tags: [Marketing]
      summary: List published blog posts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlogPostSummary' }

  /blog/posts/{slug}:
    get:
      tags: [Marketing]
      summary: Get a single published blog post by slug, with related posts
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPostDetail' }
        '404': { description: Not found }

  # ── Marketing: Admin (super_admin only) ──
  /admin/leads:
    get:
      tags: [Marketing Admin]
      summary: List all marketing leads
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Lead' }
  /admin/leads/{id}:
    patch:
      tags: [Marketing Admin]
      summary: Update lead status / notes
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadUpdateInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }

  /admin/blog/posts:
    get:
      tags: [Marketing Admin]
      summary: List all blog posts (including drafts)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlogPost' }
    post:
      tags: [Marketing Admin]
      summary: Create a blog post
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogPostInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPost' }
  /admin/blog/posts/{id}:
    patch:
      tags: [Marketing Admin]
      summary: Update a blog post
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogPostInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPost' }
    delete:
      tags: [Marketing Admin]
      summary: Delete a blog post
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Deleted }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Auth ──
    RegisterInput:
      type: object
      required: [restaurantName, ownerName, email, password]
      properties:
        restaurantName: { type: string }
        ownerName: { type: string }
        email: { type: string }
        password: { type: string, minLength: 8 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    AuthUser:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        tenantId: { type: ["integer", "null"] }
        restaurantId: { type: ["integer", "null"] }
        isSuperAdmin: { type: boolean }
        avatarUrl: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        createdAt: { type: string }

    AuthResult:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"
        tenant:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            planStatus: { type: string }
            trialEndsAt: { type: ["string", "null"] }

    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    # ── Subscription Plans ──
    SubscriptionPlan:
      type: object
      required: [id, name, slug, price, billingPeriod]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        price: { type: string }
        billingPeriod: { type: string }
        maxRestaurants: { type: integer }
        maxBranches: { type: integer }
        maxStaff: { type: integer }
        maxTables: { type: integer }
        maxMenuItems: { type: integer }
        trialDays: { type: integer }
        features:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string }

    # ── Tenants ──
    Tenant:
      type: object
      required: [id, name, slug, planStatus]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        planId: { type: ["integer", "null"] }
        planStatus: { type: string }
        trialEndsAt: { type: ["string", "null"] }
        isActive: { type: boolean }
        isSuspended: { type: boolean }
        logoUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    TenantList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        total: { type: integer }

    TenantInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        planId: { type: integer }
        primaryColor: { type: string }

    TenantUpdate:
      type: object
      properties:
        name: { type: string }
        planId: { type: integer }
        planStatus: { type: string }
        isActive: { type: boolean }
        logoUrl: { type: string }
        primaryColor: { type: string }

    # ── Restaurants ──
    Restaurant:
      type: object
      required: [id, tenantId, name, slug]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        currency: { type: string }
        taxRate: { type: string }
        serviceCharge: { type: string }
        logoUrl: { type: ["string", "null"] }
        coverImageUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        openingTime: { type: string }
        closingTime: { type: string }
        createdAt: { type: string }

    RestaurantInput:
      type: object
      required: [tenantId, name, slug]
      properties:
        tenantId: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        city: { type: string }
        country: { type: string }
        taxRate: { type: string }
        openingTime: { type: string }
        closingTime: { type: string }

    RestaurantUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        city: { type: string }
        taxRate: { type: string }
        serviceCharge: { type: string }
        logoUrl: { type: string }
        openingTime: { type: string }
        closingTime: { type: string }

    # ── Branches ──
    Branch:
      type: object
      required: [id, restaurantId, name]
      properties:
        id: { type: integer }
        restaurantId: { type: integer }
        name: { type: string }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        isMain: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: string }

    BranchInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        isMain: { type: boolean }

    # ── Users ──
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        phone: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        restaurantId: { type: ["integer", "null"] }
        lastLoginAt: { type: ["string", "null"] }
        createdAt: { type: string }

    UserInput:
      type: object
      required: [name, email, role, passwordHash]
      properties:
        name: { type: string }
        email: { type: string }
        passwordHash: { type: string }
        role: { type: string }
        phone: { type: string }
        restaurantId: { type: integer }
        tenantId: { type: integer }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        role: { type: string }
        isActive: { type: boolean }
        avatarUrl: { type: string }

    StaffMember:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        phone: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        lastLoginAt: { type: ["string", "null"] }
        createdAt: { type: string }

    # ── Floor Tables ──
    FloorTable:
      type: object
      required: [id, restaurantId, tableNumber, capacity, status]
      properties:
        id: { type: integer }
        restaurantId: { type: integer }
        tableNumber: { type: string }
        capacity: { type: integer }
        status: { type: string }
        positionX: { type: integer }
        positionY: { type: integer }
        shape: { type: string }
        qrCode: { type: ["string", "null"] }
        isActive: { type: boolean }

    FloorTableInput:
      type: object
      required: [tableNumber, capacity]
      properties:
        tableNumber: { type: string }
        capacity: { type: integer }
        positionX: { type: integer }
        positionY: { type: integer }
        shape: { type: string }

    FloorTableUpdate:
      type: object
      properties:
        tableNumber: { type: string }
        capacity: { type: integer }
        status: { type: string }
        positionX: { type: integer }
        positionY: { type: integer }
        shape: { type: string }
        isActive: { type: boolean }

    QrCodeData:
      type: object
      required: [qrUrl, tableNumber]
      properties:
        qrUrl: { type: string }
        tableNumber: { type: string }
        svgData: { type: string }

    # ── Reservations ──
    Reservation:
      type: object
      required: [id, restaurantId, guestName, scheduledAt, status]
      properties:
        id: { type: integer }
        restaurantId: { type: integer }
        tableId: { type: ["integer", "null"] }
        guestName: { type: string }
        guestPhone: { type: ["string", "null"] }
        guestEmail: { type: ["string", "null"] }
        partySize: { type: integer }
        scheduledAt: { type: string }
        status: { type: string }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }

    ReservationInput:
      type: object
      required: [guestName, scheduledAt, partySize]
      properties:
        guestName: { type: string }
        guestPhone: { type: string }
        guestEmail: { type: string }
        tableId: { type: integer }
