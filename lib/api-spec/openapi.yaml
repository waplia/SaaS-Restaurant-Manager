  /subscription-plans/{id}:
    get:
      operationId: getSubscriptionPlan
      tags: [subscription-plans]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Subscription plan
          content:
