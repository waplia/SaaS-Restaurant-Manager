components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    # ── Subscription Plans ──
    SubscriptionPlan:
      type: object
      required: [id, name, slug, price, billingPeriod]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        price: { type: string }
        billingPeriod: { type: string }
        maxRestaurants: { type: integer }
        maxBranches: { type: integer }
        maxStaff: { type: integer }
        maxTables: { type: integer }
        maxMenuItems: { type: integer }
        trialDays: { type: integer }
        features:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string }

    # ── Tenants ──
    Tenant:
      type: object
      required: [id, name, slug, planStatus]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        planId: { type: ["integer", "null"] }
        planStatus: { type: string }
        trialEndsAt: { type: ["string", "null"] }
        isActive: { type: boolean }
        isSuspended: { type: boolean }
        logoUrl: { type: ["string", "null"] }
        primaryColor: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    TenantList:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        total: { type: integer }

    TenantInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        planId: { type: integer }
        primaryColor: { type: string }

    TenantUpdate:
      type: object
      properties:
        name: { type: string }
        planId: { type: integer }
        planStatus: { type: string }
        isActive: { type: boolean }
        logoUrl: { type: string }
        primaryColor: { type: string }

    # ── Restaurants ──
    Restaurant:
      type: object
      required: [id, tenantId, name, slug]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        currency: { type: string }
        taxRate: { type: string }
        serviceCharge: { type: string }
        logoUrl: { type: ["string", "null"] }
        coverImageUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        openingTime: { type: string }
        closingTime: { type: string }
        createdAt: { type: string }

    RestaurantInput:
      type: object
      required: [tenantId, name, slug]
      properties:
        tenantId: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        city: { type: string }
        country: { type: string }
        taxRate: { type: string }
        openingTime: { type: string }
        closingTime: { type: string }

    RestaurantUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        city: { type: string }
        taxRate: { type: string }
        serviceCharge: { type: string }
        logoUrl: { type: string }
        openingTime: { type: string }
        closingTime: { type: string }

    # ── Branches ──
    Branch:
      type: object
      required: [id, restaurantId, name]
      properties:
        id: { type: integer }
        restaurantId: { type: integer }
        name: { type: string }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        isMain: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: string }

    BranchInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        isMain: { type: boolean }

    # ── Users ──
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        phone: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        restaurantId: { type: ["integer", "null"] }
        lastLoginAt: { type: ["string", "null"] }
        createdAt: { type: string }

    UserInput:
      type: object
      required: [name, email, role, passwordHash]
      properties:
        name: { type: string }
        email: { type: string }
        passwordHash: { type: string }
        role: { type: string }
        phone: { type: string }
        restaurantId: { type: integer }
        tenantId: { type: integer }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        role: { type: string }
        isActive: { type: boolean }
        avatarUrl: { type: string }

    StaffMember:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        phone: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        isActive: { type: boolean }
        lastLoginAt: { type: ["string", "null"] }
        createdAt: { type: string }

    # ── Floor Tables ──
    FloorTable:
      type: object
      required: [id, restaurantId, tableNumber, capacity, status]
      properties:
        id: { type: integer }
        restaurantId: { type: integer }
        tableNumber: { type: string }
        capacity: { type: integer }
        status: { type: string }
        positionX: { type: integer }
        positionY: { type: integer }
        shape: { type: string }
        qrCode: { type: ["string", "null"] }
        isActive: { type: boolean }

    FloorTableInput:
      type: object
      required: [tableNumber, capacity]
      properties:
        tableNumber: { type: string }
        capacity: { type: integer }
        positionX: { type: integer }
        positionY: { type: integer }
        shape: { type: string }

    FloorTableUpdate:
      type: object
      properties:
        tableNumber: { type: string }
        capacity: { type: integer }
        status: { type: string }
        positionX: { type: integer }
        positionY: { type: integer }
        shape: { type: string }
        isActive: { type: boolean }

    QrCodeData:
      type: object
      required: [qrUrl, tableNumber]
      properties:
        qrUrl: { type: string }
        tableNumber: { type: string }
        svgData: { type: string }

    # ── Reservations ──
    Reservation:
      type: object
      required: [id, restaurantId, guestName, scheduledAt, status]
      properties:
        id: { type: integer }
        restaurantId: { type: integer }
        tableId: { type: ["integer", "null"] }
        guestName: { type: string }
        guestPhone: { type: ["string", "null"] }
        guestEmail: { type: ["string", "null"] }
        partySize: { type: integer }
