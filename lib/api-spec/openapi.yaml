          description: Updated menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
    delete:
      operationId: deleteMenu
      tags: [menus]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  # ─── Menu Categories ──────────────────────────────────────────
  /restaurants/{restaurantId}/categories:
    get:
      operationId: listMenuCategories
      tags: [menu-categories]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: menuId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: List of menu categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuCategory"
    post:
      operationId: createMenuCategory
      tags: [menu-categories]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuCategoryInput"
      responses:
