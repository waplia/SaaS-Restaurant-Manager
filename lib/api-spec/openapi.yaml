  # ─── Menu Items ───────────────────────────────────────────────
  /restaurants/{restaurantId}/items:
    get:
      operationId: listMenuItems
      tags: [menu-items]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: categoryId, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [menu-items]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Created menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

  /restaurants/{restaurantId}/items/{id}:
    get:
      operationId: getMenuItem
      tags: [menu-items]
      parameters:
        - { name: restaurantId, in: path, required: true, schema: { type: integer } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
