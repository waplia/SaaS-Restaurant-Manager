      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuInput"
      responses:
        "201":
          description: Created menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"

  /restaurants/{restaurantId}/menus/{id}:
    patch:
      operationId: updateMenu
      tags: [menus]
      parameters:
